version: 2

# Commit-message prefixes give Dependabot PRs Conventional Commits titles
# (build(deps): ..., ci(deps): ...), so they pass the pr-title check.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5

  # Pinned development tools (govulncheck), see tools/go.mod.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5

  # Updates keep the commit-SHA pins and their "# vX.Y.Z" comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 5
