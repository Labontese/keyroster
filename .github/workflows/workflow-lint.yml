name: Workflow lint

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

jobs:
  pinned-actions:
    name: pinned-actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that every action is pinned to a commit SHA
        run: bash scripts/check-pinned-actions.sh
