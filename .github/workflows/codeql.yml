name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

# Least privilege: nothing by default; the analysis job may only read the
# source and upload results to code scanning.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # pcsc-lite headers for the -tags piv build below (piv-go uses cgo).
      # Installed before init, so the CodeQL build tracer does not see apt.
      - if: matrix.language == 'go'
        name: Install pcsc-lite headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpcsclite-dev
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        name: Build (static)
        run: CGO_ENABLED=0 go build ./...
      # The static build never compiles internal/keystore/piv or
      # cmd/keyroster-signer/backends_piv.go (build tag piv), so build the
      # shipped piv variant as well for the extractor (E-WR-04).
      - if: matrix.language == 'go'
        name: Build (piv)
        run: CGO_ENABLED=1 go build -tags piv ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
