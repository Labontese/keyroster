name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The job ids double as the required status check names in the
# main-integrity ruleset. Renaming a job blocks every merge until the
# ruleset is updated (see CONTRIBUTING.md).
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify module downloads
        run: go mod verify
      - name: Build (static)
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-compile the CLI
        run: |
          for goos in windows darwin freebsd; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH=amd64 go build -o /dev/null ./cmd/keyroster
          done
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # ssh-keygen (preinstalled on the runner) is the SSHSIG oracle; with
      # KEYROSTER_REQUIRE_ORACLE=1 a missing ssh-keygen fails the oracle
      # tests instead of skipping them.
      - name: Test (race detector)
        env:
          KEYROSTER_REQUIRE_ORACLE: "1"
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for reachable vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target (fails when zero targets ran)
        env:
          FUZZTIME: 30s
        run: bash scripts/fuzz.sh

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Conventional Commits PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh
