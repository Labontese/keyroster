name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The job ids double as the required status check names in the
# main-integrity ruleset. Renaming a job blocks every merge until the
# ruleset is updated (see CONTRIBUTING.md). The required pr-title check
# lives in pr-title.yml, because it must also run when a PR title is edited.
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify module downloads
        run: go mod verify
      - name: Build (static)
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-compile the CLI
        run: |
          for goos in windows darwin freebsd; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH=amd64 go build -o /dev/null ./cmd/keyroster
          done
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # ssh-keygen (preinstalled on the runner) is the SSHSIG oracle; with
      # KEYROSTER_REQUIRE_ORACLE=1 a missing ssh-keygen fails the oracle
      # tests instead of skipping them.
      # KEYROSTER_REQUIRE_SSH_AGENT=1 does the same for ssh-agent in
      # TestAgentLifetime (same openssh-client package as ssh-keygen).
      - name: Test (race detector)
        env:
          KEYROSTER_REQUIRE_ORACLE: "1"
          KEYROSTER_REQUIRE_SSH_AGENT: "1"
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  # PLAT-05: the CLI on Windows and macOS. Not required checks yet: a new
  # required check must run green on main first, and the owner applies the
  # ruleset (Pitfall 10/11); 02-14 adds both to main-integrity.
  # cli-windows runs keyroster agent against the inbox OpenSSH client when
  # the runner image has it, and then requires it (KEYROSTER_REQUIRE_INBOX_SSH).
  cli-windows:
    name: cli-windows
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Detect the inbox OpenSSH client
        shell: bash
        run: |
          if [ -f /c/Windows/System32/OpenSSH/ssh.exe ]; then
            echo "inbox ssh.exe present: $(/c/Windows/System32/OpenSSH/ssh.exe -V 2>&1)"
            echo "KEYROSTER_REQUIRE_INBOX_SSH=1" >> "$GITHUB_ENV"
          else
            echo "inbox ssh.exe absent; TestInboxSSHOffersAgentCert will skip"
          fi
      - name: Test
        shell: bash
        run: go test -count=1 ./cmd/keyroster/... ./internal/winagent/... ./internal/webauthn/... ./internal/wire/... ./internal/trust/... ./internal/sshsig/... ./internal/directory/...

  cli-macos:
    name: cli-macos
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A missing ssh-agent fails TestAgentLifetime instead of skipping it.
      - name: Test
        env:
          KEYROSTER_REQUIRE_SSH_AGENT: "1"
        run: go test -count=1 ./cmd/keyroster/... ./internal/winagent/... ./internal/webauthn/... ./internal/wire/... ./internal/trust/... ./internal/sshsig/... ./internal/directory/...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for reachable vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

  # KEY-01: no network, template, exec or plugin package (and no TPM
  # simulator) in keyroster-signer's dependency graph, with and without the
  # piv build tag; documented exceptions only. go list needs no C toolchain
  # or headers, so the piv pass (CGO_ENABLED=1) installs nothing.
  # T-02-75: no ./cmd/... binary links a test-only helper (linux, windows,
  # darwin; with and without piv).
  dependency-firewall:
    name: dependency-firewall
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the signer's dependency graph
        run: bash scripts/dep-firewall.sh
      - name: Check that no binary links a test-only helper
        run: bash scripts/testonly-firewall.sh

  # REPO-02, T-01-61: fail when any package in keyroster-signer's graph gains
  # a capability that is not in test/capslock/keyroster-signer.json.
  capslock:
    name: capslock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify the tools module
        run: cd tools && go mod verify
      - name: Compare capabilities with the baseline
        run: bash scripts/capslock-check.sh

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target (fails when zero targets ran)
        env:
          FUZZTIME: 30s
        run: bash scripts/fuzz.sh
