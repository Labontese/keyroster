name: Systemd

# KEY-01, D-08: run keyroster-signer under its real systemd units on a
# systemd host. test/systemd/smoke.sh installs the units, bootstraps the
# signer (agent backend), issues a certificate as a keyroster-admin member,
# checks that the signer's network namespace holds only lo, checks the
# sandbox of both the signer and its ssh-agent (which holds the CA keys), and
# gates `systemd-analyze security` on both units.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The check name "systemd-sandbox" becomes a required status check in plan
# 01-15. After that, renaming the job blocks every merge until the ruleset is
# updated (see CONTRIBUTING.md).
jobs:
  systemd-sandbox:
    name: systemd-sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record tool versions
        run: |
          systemctl --version | head -n 1
          ssh -V
          uname -r
      # sudo resets PATH (secure_path); pass the runner's PATH so the script
      # finds the setup-go toolchain. The script builds as the runner user.
      # KEYROSTER_SECURITY_THRESHOLD is the gate for `systemd-analyze
      # security --threshold` on keyroster-signer.service: exposure x10, so 20
      # is 2.0. Measured on PR #15: 0.7 (SAFE).
      # KEYROSTER_AGENT_SECURITY_THRESHOLD is the same gate on
      # keyroster-signer-agent.service: 14 is 1.4. Measured offline
      # (systemd-analyze security --offline=yes, WSL Ubuntu 24.04, systemd
      # 255.4): 1.3 (OK); not yet measured on a runner. The same offline run
      # gives the signer unit 0.7, matching the runner.
      # Lower either freely; raise one only in a reviewed PR that records the
      # per-directive report.
      - name: Smoke test the sandboxed signer
        env:
          KEYROSTER_SECURITY_THRESHOLD: "20"
          KEYROSTER_AGENT_SECURITY_THRESHOLD: "14"
        run: >-
          sudo env "PATH=$PATH"
          "KEYROSTER_SECURITY_THRESHOLD=$KEYROSTER_SECURITY_THRESHOLD"
          "KEYROSTER_AGENT_SECURITY_THRESHOLD=$KEYROSTER_AGENT_SECURITY_THRESHOLD"
          bash test/systemd/smoke.sh
      - name: Print the unit journals
        if: failure()
        run: sudo journalctl --no-pager -u keyroster-signer -u keyroster-signer-agent
