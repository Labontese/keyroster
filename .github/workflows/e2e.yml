name: E2E

# End-to-end tests against real OpenSSH: keyroster ca issue -> keyroster-signer
# (CA key in ssh-agent) -> a certificate that a non-root sshd on 127.0.0.1
# accepts or rejects.
#
# OpenSSH is built from SHA-256-pinned, GPG-verified portable release tarballs
# by scripts/build-openssh.sh. Portable 9.5p1 is the closest upstream code to
# Windows' inbox OpenSSH_for_Windows_9.5p2, which is Microsoft's own build and
# has no upstream tarball. This workflow is NOT coverage of Windows OpenSSH
# 9.5p2: the 9.5p2 evidence is the manual Windows check of plan 01-15.
# 10.5p1 is the latest portable release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The check names "e2e (9.5p1)" and "e2e (10.5p1)" are required status checks
# in the main-integrity ruleset. Renaming the job or changing the matrix
# blocks every merge until the ruleset is updated (see CONTRIBUTING.md).
jobs:
  e2e:
    name: e2e (${{ matrix.openssh }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        openssh: ["9.5p1", "10.5p1"]
    env:
      OPENSSH_VERSION: ${{ matrix.openssh }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Caches written by a pull_request run are scoped to that PR's ref, so a
      # PR cannot replace main's cached build. The key changes with the
      # version and with the build script (which holds the SHA-256 pins), and
      # the script's stamp file makes it rebuild on any version/hash mismatch.
      - name: Restore the OpenSSH build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keyroster/openssh-${{ env.OPENSSH_VERSION }}
          key: openssh-${{ runner.os }}-${{ env.OPENSSH_VERSION }}-${{ hashFiles('scripts/build-openssh.sh') }}
      - name: Build OpenSSH (verified tarball)
        run: bash scripts/build-openssh.sh "$OPENSSH_VERSION"
      - name: Run the e2e suite
        run: |
          mkdir -p e2e-logs
          KEYROSTER_OPENSSH_PREFIX="$HOME/.cache/keyroster/openssh-$OPENSSH_VERSION" \
            go test -tags e2e -count=1 -v ./test/e2e/... 2>&1 | tee "e2e-logs/go-test-$OPENSSH_VERSION.log"
      # The harness prints the sshd, signer and agent logs of every failed
      # test into the go test output captured above.
      - name: Upload the sshd logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ env.OPENSSH_VERSION }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn
