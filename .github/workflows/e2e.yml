name: E2E

# End-to-end tests against real OpenSSH: keyroster ca issue -> keyroster-signer
# (CA key in ssh-agent) -> a certificate that a non-root sshd on 127.0.0.1
# accepts or rejects.
#
# OpenSSH is built from SHA-256-pinned, GPG-verified portable release tarballs
# by scripts/build-openssh.sh. Portable 9.5p1 is the closest upstream code to
# Windows' inbox OpenSSH_for_Windows_9.5p2, which is Microsoft's own build and
# has no upstream tarball. This workflow is NOT coverage of Windows OpenSSH
# 9.5p2: the 9.5p2 evidence is the manual Windows check of plan 01-15.
# 10.5p1 is the latest portable release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The check names "e2e (9.5p1)", "e2e (10.5p1)", "e2e-probe (9.5p1)" and
# "e2e-probe (10.5p1)" are required status checks in the main-integrity
# ruleset. Renaming a job or changing a matrix blocks every merge until the
# ruleset is updated (see CONTRIBUTING.md).
jobs:
  e2e:
    name: e2e (${{ matrix.openssh }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        openssh: ["9.5p1", "10.5p1"]
    env:
      OPENSSH_VERSION: ${{ matrix.openssh }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Caches written by a pull_request run are scoped to that PR's ref, so a
      # PR cannot replace main's cached build. The key changes with the
      # version and with the build script (which holds the SHA-256 pins), and
      # the script's stamp file makes it rebuild on any version/hash mismatch.
      - name: Restore the OpenSSH build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keyroster/openssh-${{ env.OPENSSH_VERSION }}
          key: openssh-${{ runner.os }}-${{ env.OPENSSH_VERSION }}-${{ hashFiles('scripts/build-openssh.sh') }}
      - name: Build OpenSSH (verified tarball)
        run: bash scripts/build-openssh.sh "$OPENSSH_VERSION"
      - name: Run the e2e suite
        run: |
          mkdir -p e2e-logs
          KEYROSTER_OPENSSH_PREFIX="$HOME/.cache/keyroster/openssh-$OPENSSH_VERSION" \
            go test -tags e2e -count=1 -timeout 20m -v ./test/e2e/... 2>&1 | tee "e2e-logs/go-test-$OPENSSH_VERSION.log"
      # The harness prints the sshd, signer and agent logs of every failed
      # test into the go test output captured above.
      - name: Upload the sshd logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ env.OPENSSH_VERSION }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn

  # The probe certificate tests (03-10) in a job of their own, so the main
  # lanes do not grow: they carry the build tags e2e and e2eprobe, which the
  # main lanes' -tags e2e does not compile. A -run filter that matches
  # nothing makes go test exit 0, so the job also requires each named test's
  # PASS line. No condition and no path filter: a skipped job would report
  # success to its required check.
  e2e-probe:
    name: e2e-probe (${{ matrix.openssh }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        openssh: ["9.5p1", "10.5p1"]
    env:
      OPENSSH_VERSION: ${{ matrix.openssh }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The same cache path and key as the e2e job: both jobs use one build.
      - name: Restore the OpenSSH build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keyroster/openssh-${{ env.OPENSSH_VERSION }}
          key: openssh-${{ runner.os }}-${{ env.OPENSSH_VERSION }}-${{ hashFiles('scripts/build-openssh.sh') }}
      - name: Build OpenSSH (verified tarball)
        run: bash scripts/build-openssh.sh "$OPENSSH_VERSION"
      - name: Run the probe e2e tests
        run: |
          mkdir -p e2e-logs
          KEYROSTER_OPENSSH_PREFIX="$HOME/.cache/keyroster/openssh-$OPENSSH_VERSION" \
            go test -tags "e2e e2eprobe" -run '^(TestProbeCertsAgainstSSHD|TestProbeSSHDFacts|TestProbeSelfTestEndToEnd|TestProbePairSpacing)$' -count=1 -timeout 12m -v ./test/e2e/... 2>&1 | tee "e2e-logs/go-test-probe-$OPENSSH_VERSION.log"
      - name: Check that both probe tests ran and passed
        run: |
          for t in TestProbeCertsAgainstSSHD TestProbeSSHDFacts TestProbeSelfTestEndToEnd TestProbePairSpacing; do grep -q -- "^--- PASS: $t (" "e2e-logs/go-test-probe-$OPENSSH_VERSION.log" || { echo "the log has no PASS line for $t"; exit 1; }; done
      - name: Upload the probe logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-probe-logs-${{ env.OPENSSH_VERSION }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn
