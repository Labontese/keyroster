name: PIV

# YubiKey PIV backend (KEY-05, D-12). The backend is behind the piv build tag
# and links pcsc-lite through cgo (piv-go). CI has no YubiKey: the unit tests
# and the signer's PIV rotation leg (TestSignerRestartMixedBundle/piv, 03-12f)
# run against the in-memory fake card of a pivfake build
# (internal/keystore/piv/fake.go), which the release build never contains;
# the release guard of the build step proves that on every run. Real-hardware
# validation is tracked in docs/security/needs-hardware.md for the Phase 6
# review.
#
# The job also proves the exclusion (T-01-53): default builds (CGO_ENABLED=0,
# no tags) of keyroster and keyroster-signer link neither piv-go nor cgo.

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, like ci.yml, so that a new advisory against piv-go fails the
  # govulncheck step without waiting for a code change.
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

# Least privilege: nothing by default, read-only contents per job.
permissions: {}

# The check name "build-piv" becomes a required status check in plan 01-15.
# After that, renaming the job blocks every merge until the ruleset is updated
# (see CONTRIBUTING.md).
jobs:
  build-piv:
    name: build-piv
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Build-only package from the Ubuntu archive (T-01-SC); no Go modules.
      - name: Install pcsc-lite headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpcsclite-dev
      - name: Record tool versions
        run: |
          dpkg-query -W libpcsclite-dev libpcsclite1
          go version
      # The govulncheck job in ci.yml scans the default build only, where
      # piv-go is unreachable. Scan the piv build too (E-WR-04); it needs the
      # pcsc-lite headers installed above, because piv-go uses cgo.
      - name: Scan the piv build for reachable vulnerabilities
        run: CGO_ENABLED=1 go tool -modfile=tools/go.mod govulncheck -tags piv ./...
      # Both tag sets: the release files (piv) and the test build with the
      # fake card (piv,pivfake, 03-12f).
      - name: Vet the tagged packages
        run: |
          CGO_ENABLED=1 go vet -tags piv ./internal/keystore/piv/... ./cmd/keyroster-signer/...
          CGO_ENABLED=1 go vet -tags piv,pivfake ./internal/keystore/piv/... ./cmd/keyroster-signer/...
      # The lint job in ci.yml builds without tags, so it never sees the
      # piv package or the signer's piv-tagged files; lint them here with
      # the same pinned linter and config. piv,pivfake is a superset of the
      # release files: it adds fake.go and the signer's PIV leg.
      - name: Lint the tagged package
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: "1"
        with:
          version: v2.14.0
          args: --build-tags piv,pivfake ./internal/keystore/piv/... ./cmd/keyroster-signer/...
      # The tests use the fake card, so they build only with pivfake: with
      # -tags piv alone the package has no test files and would pass
      # silently, which the PASS-line loop refuses.
      - name: Run the PIV keystore unit tests (race detector)
        run: |
          CGO_ENABLED=1 go test -race -tags piv,pivfake -count=1 -timeout 15m -v ./internal/keystore/piv/... 2>&1 | tee "$RUNNER_TEMP/piv-unit.log"
          for t in TestPIVProvisionAndIssue TestPIVRefusals TestPIVPINRetriesGuard TestPIVSignWithoutMgmtKey TestPIVConcurrency TestPIVGenerationAllocator TestGenerationKeyAfterReopen TestPIVGenerationSlots TestPIVHolds TestPIVRemoveGeneration TestPIVManagementKeyAtUse TestPIVFakeRegistry; do grep -q -- "^--- PASS: $t (" "$RUNNER_TEMP/piv-unit.log" || { echo "the log has no PASS line for $t" >&2; exit 1; }; done
      # The signer's PIV rotation leg on the fake card (03-12f). go test
      # indents a subtest's result line, so its PASS check is not anchored
      # at column 0; a skipped leg fails the step.
      - name: Run the signer's PIV rotation leg on the fake card (race detector)
        run: |
          LOG="$RUNNER_TEMP/piv-rotation-leg.log"
          CGO_ENABLED=1 go test -race -tags piv,pivfake -count=1 -timeout 15m -v -run '^TestSignerRestartMixedBundle$/^piv$' ./cmd/keyroster-signer/ 2>&1 | tee "$LOG"
          grep -qE -- '^ *--- PASS: TestSignerRestartMixedBundle/piv \(' "$LOG"
          if grep -qF -- '--- SKIP: TestSignerRestartMixedBundle/' "$LOG"; then echo "the PIV rotation leg skipped" >&2; exit 1; fi
      # The release guard (03-12f): the release piv build leaves out fake.go,
      # its build info names -tags=piv exactly, and its binary holds no fake
      # symbol. (1a) and (3a) are positive controls, so that a broken go
      # list or nm cannot pass the checks after them; a failing go list in
      # (1) counts as listing fake.go.
      - name: Build keyroster-signer with the PIV backend
        run: |
          CGO_ENABLED=1 go build -tags piv -o "$RUNNER_TEMP/keyroster-signer-piv" ./cmd/keyroster-signer
          go version -m "$RUNNER_TEMP/keyroster-signer-piv" | tee "$RUNNER_TEMP/piv-buildinfo.txt"
          grep -q 'github.com/go-piv/piv-go/v2' "$RUNNER_TEMP/piv-buildinfo.txt"
          grep -q 'CGO_ENABLED=1' "$RUNNER_TEMP/piv-buildinfo.txt"
          # release piv guard: begin
          tags=piv
          bin="$RUNNER_TEMP/keyroster-signer-piv"
          go tool nm "$bin" >"$RUNNER_TEMP/piv-syms.txt"
          if ! go list -tags "$tags,pivfake" -f '{{join .GoFiles " "}}' ./internal/keystore/piv | tr ' ' '\n' | grep -Fqx fake.go; then echo "release piv guard: (1a) the pivfake build does not list fake.go, so check (1) proves nothing" >&2; exit 1; fi
          if { go list -tags "$tags" -f '{{join .GoFiles " "}}' ./internal/keystore/piv || echo fake.go; } | tr ' ' '\n' | grep -Fqx fake.go; then echo "release piv guard: (1) the release build lists fake.go" >&2; exit 1; fi
          if [ "$(go version -m "$bin" | awk -F '\t' '$2 == "build" && $3 ~ /^-tags=/ {print $3}')" != "-tags=piv" ]; then echo "release piv guard: (2) the binary's build info does not name exactly -tags=piv" >&2; exit 1; fi
          if ! grep -qF 'internal/keystore/piv.(*backend).Key' "$RUNNER_TEMP/piv-syms.txt"; then echo "release piv guard: (3a) nm did not list the backend's Key symbol, so check (3) proves nothing" >&2; exit 1; fi
          if grep -qiE 'internal/keystore/piv\.[^ ]*fake' "$RUNNER_TEMP/piv-syms.txt"; then echo "release piv guard: (3) the binary holds a fake symbol of package piv" >&2; exit 1; fi
          echo "release piv binary: -tags=piv, no fake.go, no fake symbol"
          # release piv guard: end
      - name: Default builds exclude piv-go and cgo
        run: |
          CGO_ENABLED=0 go build ./...
          deps=$(CGO_ENABLED=0 go list -deps ./cmd/keyroster-signer ./cmd/keyroster)
          if grep -q 'github.com/go-piv/piv-go' <<<"$deps"; then
            echo "a default build links piv-go" >&2
            exit 1
          fi
          for cmd in keyroster keyroster-signer; do
            CGO_ENABLED=0 go build -o "$RUNNER_TEMP/$cmd" "./cmd/$cmd"
            go version -m "$RUNNER_TEMP/$cmd" >"$RUNNER_TEMP/$cmd-buildinfo.txt"
            grep -q 'CGO_ENABLED=0' "$RUNNER_TEMP/$cmd-buildinfo.txt"
            if grep -q 'go-piv' "$RUNNER_TEMP/$cmd-buildinfo.txt"; then
              echo "$cmd links piv-go" >&2
              exit 1
            fi
          done
          echo "default keyroster and keyroster-signer: CGO_ENABLED=0, no piv-go"
