name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# Least privilege: nothing by default. publish_results also requires that no
# workflow-level permission is write, and that the workflow has no top-level
# env or defaults.
permissions: {}

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published results with a GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
