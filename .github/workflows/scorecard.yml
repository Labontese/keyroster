name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# Least privilege: nothing by default. publish_results also requires that no
# workflow-level permission is write, and that the workflow has no top-level
# env or defaults.
permissions: {}

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published results with a GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
