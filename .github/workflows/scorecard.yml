name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# Least privilege: nothing by default. publish_results also requires that no
# workflow-level permission is write, and that the workflow has no top-level
# env or defaults.
permissions: {}

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published results with a GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
