version: "2"

linters:
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: math/rand
              desc: use crypto/rand
            - pkg: math/rand/v2
              desc: use crypto/rand
            - pkg: github.com/mattn/go-sqlite3
              desc: cgo; use modernc.org/sqlite
            - pkg: github.com/stripe/krl
              desc: archived; use the in-repo KRL encoder
            - pkg: github.com/google/go-tpm-tools
              desc: pulls a cgo TPM simulator; use swtpm in tests
            - pkg: github.com/google/go-tpm/tpm2/transport/simulator
              desc: cgo TPM simulator that production never uses; use swtpm in tests
        # KEY-01: the signer is network-less by construction. Direct imports
        # of network, exec and template packages are denied in every signer
        # package (tests excluded: they may run go and OpenSSH tools).
        # Transitive dependencies are checked by the go list -deps firewall
        # and capslock in plan 01-13.
        signer-no-network:
          list-mode: lax
          files:
            - "**/internal/signer/**"
            - "**/internal/keystore/**"
            - "**/internal/cert/**"
            - "**/internal/certprofile/**"
            - "**/internal/serial/**"
            - "**/internal/signerdb/**"
            - "**/internal/wire/**"
            - "**/cmd/keyroster-signer/**"
            - "**/internal/doctor/**"
            - "**/internal/webauthn/**"
            - "**/internal/directory/**"
            - "**/internal/krl/**"
            - "!$test"
          deny:
            - pkg: net/http
              desc: the signer is network-less (KEY-01)
            - pkg: net/rpc
              desc: the signer is network-less (KEY-01)
            - pkg: net/smtp
              desc: the signer is network-less (KEY-01)
            - pkg: crypto/tls
              desc: the signer is network-less (KEY-01)
            - pkg: os/exec
              desc: the signer never runs other programs (KEY-01)
            - pkg: html/template
              desc: no templates in the signer (KEY-01)
            - pkg: text/template
              desc: no templates in the signer (KEY-01)
            - pkg: github.com/go-webauthn
              desc: "D-17: the signer verifies assertions with internal/webauthn only"
        # D-05 (owner's answer: loopback-only): the root applier has no HTTP,
        # TLS or RPC code; its only network use is the loopback self-test.
        # scripts/dep-firewall.sh checks the transitive graph.
        agent-apply-no-http:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/cmd/keyroster-agent/**"
          deny:
            - pkg: net/http
              desc: the root applier has no HTTP code (D-05, loopback-only)
            - pkg: crypto/tls
              desc: the root applier has no TLS code (D-05, loopback-only)
            - pkg: net/rpc
              desc: the root applier has no RPC code (D-05, loopback-only)
        # PR #67 review: os/exec is imported only by internal/agent/execsite,
        # under any name; TestPaths pins its constructors and their callers,
        # and capslock-check confines EXEC to it.
        agent-exec-only-in-execsite:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/cmd/keyroster-agent/**"
            - "!**/internal/agent/execsite/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: the agent runs programs only through internal/agent/execsite (paths.ExecSites)
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: write to an io.Writer instead of the print builtins
        - pattern: '\.SignCert\b'
          msg: certificates are signed only by internal/cert.Build (CA-06, CA-07)
        - pattern: 'exec\.Command(Context)?\b'
          msg: programs are run only through internal/agent/execsite (paths.ExecSites) and the reviewed exceptions below
        - pattern: '^(os\.StartProcess|syscall\.(Exec|ForkExec|StartProcess)|unix\.Exec)$'
          msg: programs are run only through internal/agent/execsite (paths.ExecSites)
  exclusions:
    rules:
      # internal/cert.Build is the single SignCert call site.
      - path: ^internal/cert/
        linters:
          - forbidigo
        text: SignCert
      # The exec sites: the agent's (internal/agent/execsite, pinned by
      # internal/agent/paths TestPaths), the CLI opening a browser for passkey login, the
      # Windows agent check, and tests, which run go and OpenSSH tools.
      - path: ^internal/agent/execsite/
        linters:
          - forbidigo
        text: exec\.Command
      - path: ^cmd/keyroster/browser_(darwin|linux|windows)\.go$
        linters:
          - forbidigo
        text: exec\.Command
      - path: ^internal/winagent/ensure_windows\.go$
        linters:
          - forbidigo
        text: exec\.Command
      - path: _test\.go$
        linters:
          - forbidigo
        text: exec\.Command
