# keyroster system identities (systemd-sysusers, sysusers.d(5)).
#
# Install as /etc/sysusers.d/keyroster.conf and run systemd-sysusers.
#
# keyroster-signer: the signing process's own system user (and its group of
# the same name). No login shell. Its home is the state directory, which the
# signer unit creates as StateDirectory= with mode 0700.
u keyroster-signer - "keyroster signer" /var/lib/keyroster-signer /usr/sbin/nologin

# keyroster-admin: members may connect to the signer socket
# /run/keyroster-signer/signer.sock (mode 0660, group keyroster-admin). The
# signer also checks every peer's credentials against its --allow-group list.
g keyroster-admin -
